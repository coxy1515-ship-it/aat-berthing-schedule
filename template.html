<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAT berthing schedule - Appleton Dock &amp; Webb Dock West</title>
<style>
  :root {
    --border: #e2e2e0;
    --text-primary: #1c1c1a;
    --text-secondary: #6b6b67;
    --surface-1: #f6f6f4;
    --surface-2: #ffffff;
    --accent: #185fa5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--text-primary);
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 1rem;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .header .updated {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 0.9rem;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
  }
  .panel-head a {
    font-size: 12px;
    font-weight: 400;
    color: var(--accent);
    text-decoration: none;
  }
  .panel-head a:hover { text-decoration: underline; }
  iframe {
    width: 100%;
    height: 75vh;
    min-height: 420px;
    border: none;
    display: block;
    background: var(--surface-1);
  }
  .fallback {
    font-size: 12px;
    color: var(--text-secondary);
    padding: 0.5rem 0.9rem;
  }
</style>
</head>
<body>

<div class="header">
  <h1>AAT berthing schedule &mdash; Appleton Dock &amp; Webb Dock West</h1>
  <span class="updated">Checked {{UPDATED_STAMP}}</span>
</div>

<div class="grid">
  <div class="panel">
    <div class="panel-head">
      <span>Appleton Dock</span>
      <a href="{{APPLETON_URL}}" target="_blank" rel="noopener">Open PDF &#8599;</a>
    </div>
    <iframe src="{{APPLETON_URL}}" title="Appleton Dock berthing schedule PDF"></iframe>
    <div class="fallback">
      If the PDF doesn't display, <a href="{{APPLETON_URL}}" target="_blank" rel="noopener">open it directly</a>.
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span>Webb Dock West</span>
      <a href="{{WEBB_URL}}" target="_blank" rel="noopener">Open PDF &#8599;</a>
    </div>
    <iframe src="{{WEBB_URL}}" title="Webb Dock West berthing schedule PDF"></iframe>
    <div class="fallback">
      If the PDF doesn't display, <a href="{{WEBB_URL}}" target="_blank" rel="noopener">open it directly</a>.
    </div>
  </div>
</div>

</body>
</html>
